<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زمانی من - سەرەکی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- نوارەی سەرەوە (بە پێچەوانەی ئاراستەی عەرەبی/کوردی دامانناوە بۆ ئەوەی وەک وێنەکەی لێبێت) -->
    <header class="top-bar">
        <!-- گێڕی ڕێکخستن لە لای ڕاست -->
        <div class="top-icon settings">⚙️</div>
        
        <!-- ئاڵا و ئاست لە لای چەپ -->
        <div class="left-icons">
            <div class="top-icon flag" id="lang-flag">🪵</div> <!-- ئاست (سەرەتا دارە) -->
            <div class="top-icon diamond" id="country-flag">🇩🇪</div> <!-- ئاڵا -->
        </div>
    </header>

    <!-- بەشی پڕۆفایل و XP -->
    <section class="profile-section">
        <div class="profile-pic">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=patrik" alt="وێنەی پڕۆفایل">
        </div>
        <div class="profile-details">
            <h2 class="username">patrik jane</h2>
            <div class="xp-container">
                <span class="xp-text">XP</span>
                <div class="xp-bar-bg">
                    <div class="xp-fill" id="xp-progress" style="width: 20%;"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- دوگمە هەڵواسراوەکانی تەنیشت -->
    <button class="side-btn ai-btn">
        <span class="ai-logo">⋈</span>
    </button>
    <button class="side-btn pen-btn">
        <span>✍️</span>
    </button>

    <!-- بەشی ناوەڕاست (مەتاهە و دوگمەکان) -->
    <main class="main-content">
        <!-- مەتاهەکە (بێ کلیک) -->
        <div class="maze-card">
            <!-- لێرەدا دەتوانیت وێنەی مەتاهەکەت دابنێیت -->
            <div class="maze-placeholder">
                <img src="maze.png" alt="Maze" style="width: 150px; opacity: 0.8;"> <!-- ئەگەر وێنەی مەتاهەت هەیە ناوی بنێ maze.png -->
            </div>
            <p class="maze-text">کاتێک دەڕێژیت لەم مەیزە کە بگەیت بە ئامانجەکەت</p>
        </div>

        <!-- دوگمەی خوێندن -->
        <button class="btn-primary big-btn">خوێندن</button>

        <!-- دوگمەی پلان و ئەرک -->
        <button class="btn-primary">پلان و ئەرکی ڕۆژانەت</button>
    </main>

    <script src="app.js"></script>
</body>
</html>
