<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زمانی من - سەرەکی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- نوارەی سەرەوە -->
    <header class="top-bar">
        <!-- دوگمەی ڕێکخستنەکان -->
        <div class="top-icon settings" onclick="window.location.href='settings.html'" style="cursor: pointer; z-index: 100; position: relative;">⚙️</div>
        
        <div class="left-icons">
            <div class="top-icon diamond" id="lang-flag">💎</div> 
            <div class="top-icon flag" id="country-flag">🇩🇪</div> 
        </div>
    </header>

    <!-- بەشی پڕۆفایل -->
    <section class="profile-section">
        <div class="profile-pic">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=patrik" alt="پڕۆفایل">
        </div>
        <div class="profile-details">
            <h2 class="username">patrik jane</h2>
            <div class="xp-container">
                <span class="xp-text">XP</span>
                <div class="xp-bar-bg">
                    <div class="xp-fill" id="xp-progress" style="width: 20%;"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ناوەڕۆکی سەرەکی -->
    <main class="main-content">
        
        <!-- مەتاهەکە (بە سیستەمی جووڵەی پڕۆفایلەوە) -->
        <div class="maze-card">
            <div class="maze-placeholder" style="position: relative; display: inline-block;">
                <img src="maze.png" alt="Maze" style="width: 150px; opacity: 0.8;">
                
                <!-- ئەمە ئەو خاڵە شینەیە کە وەک کەسەکە دەجووڵێت بەناو مەتاهەکەدا -->
                <div id="maze-player" style="position: absolute; width: 15px; height: 15px; background: #0a84ff; border-radius: 50%; border: 2px solid white; top: 5%; left: 10%; transition: all 1s ease-in-out;"></div>
            </div>
            <p class="maze-text">کاتێک دەڕێژیت لەم مەیزە کە بگەیت بە ئامانجەکەت</p>
        </div>

        <!-- دوگمەی خوێندن -->
        <button class="btn-primary big-btn">خوێندن</button>

        <!-- دوگمەی پلان و ئەرک -->
        <button class="btn-primary">پلان و ئەرکی ڕۆژانەت</button>

        <!-- دوگمەکانی AI و وایت بۆرد لە خوارەوە -->
        <div class="bottom-tools">
            <button class="side-btn ai-btn" onclick="window.location.href='ai.html'">
                <span>🤖</span>
            </button>
            <button class="side-btn pen-btn" onclick="window.location.href='whiteboard.html'">
                <span>✍️</span>
            </button>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
