<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>وایتبۆرد</title>
    <link rel="stylesheet" href="whiteboard.css">
</head>
<body>

    <!-- نوارەی سەرەوە -->
    <header class="wb-topbar">
        <div class="wb-left">
            <button class="icon-btn">〈</button>
            <button class="icon-btn" id="undo-btn">↺</button>
        </div>
        <div class="wb-title">وایتبۆرد</div>
        <div class="wb-right">
            <button class="icon-btn">⍗</button>
            <button class="icon-btn">⧉</button>
            <button class="icon-btn">✎</button>
            <button class="text-btn">ئامادەیە</button>
        </div>
    </header>

    <!-- شاشەی وێنەکێشان -->
    <div class="canvas-container">
        <canvas id="drawing-board"></canvas>
        
        <!-- نوارەی ئامرازەکان لە خوارەوە -->
        <div class="wb-toolbar">
            <button class="tool active" data-tool="pen">✏️</button>
            <button class="tool" data-tool="marker">🖍️</button>
            <button class="tool" data-tool="eraser">🧽</button>
            <div class="divider"></div>
            <input type="color" id="color-picker" value="#000000">
            <input type="range" id="size-slider" min="1" max="50" value="5">
        </div>
    </div>

    <script src="whiteboard.js"></script>
</body>
</html>
