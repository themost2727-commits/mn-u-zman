<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پلانی فێربوون | زمانی من</title><link rel="stylesheet" href="style.css"></head><body><header class="page-header"><a class="back" href="index.html">→</a><div><small>بەپێی کاتی خۆت</small><h1>پلانی فێربوون</h1></div><span class="header-emoji">🗓️</span></header><main class="container page-container"><section class="panel"><h2>پلانی تایبەتی خۆت ڕێک بخە</h2><p class="muted">ئەم پرسیارانە بۆ ڕێکخستنی کات و ئاستی فێربوونن؛ پرسیاری «بۆچی دەتەوێت فێربیت؟» لێرە نییە.</p><form id="plan-form"><label for="current-level">ئاستی ئێستات</label><select id="current-level"><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select><label for="daily-time">چەند خولەک لە ڕۆژێکدا؟</label><select id="daily-time"><option value="10">١٠ خولەک</option><option value="20" selected>٢٠ خولەک</option><option value="30">٣٠ خولەک</option><option value="45">٤٥ خولەک</option><option value="60">٦٠ خولەک</option></select><label for="daily-words">چەند وشەی نوێ لە ڕۆژێکدا؟</label><select id="daily-words"><option>٥</option><option selected>١٠</option><option>١٥</option><option>٢٠</option></select><button class="btn btn-primary full" type="submit">دروستکردنی پلان</button></form><div id="plan-result" class="result-box" hidden></div></section></main><nav class="bottom-nav"><a href="index.html"><span>⌂</span>سەرەکی</a><a href="lessons.html"><span>▤</span>وانەکان</a><a href="listening.html"><span>♬</span>گوێگرتن</a><a href="progress.html"><span>🏆</span>پێشکەوتن</a><a class="active" href="profile.html"><span>♙</span>پڕۆفایل</a></nav><script src="app.js"></script></body></html>
